# =============================================================================
# OpenClaw Docker Compose Configuration - Ubuntu Desktop with Chrome
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # OpenClaw Gateway
  # ---------------------------------------------------------------------------
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-gateway
    restart: unless-stopped
    
    env_file:
      - .env
    
    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-loopback}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD}
      - XDG_CONFIG_HOME=/home/node/.openclaw
    
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - /tmp/openclaw:/tmp/openclaw
      - /var/run/docker.sock:/var/run/docker.sock
    
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - "${OPENCLAW_GATEWAY_BIND:-loopback}"
      - --port
      - "${OPENCLAW_GATEWAY_PORT:-18789}"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    
    security_opt:
      - no-new-privileges:true
    
    user: "1000:1000"

  # ---------------------------------------------------------------------------
  # Full Ubuntu Desktop with Chrome
  # ---------------------------------------------------------------------------
  openclaw-browser:
    image: lscr.io/linuxserver/webtop:ubuntu-mate
    container_name: openclaw-browser
    restart: unless-stopped
    
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
    
    ports:
      - "127.0.0.1:3000:3000"
    
    volumes:
      - browser-data:/config
    
    shm_size: 2gb
    
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Volumes
# =============================================================================

volumes:
  browser-data:
    driver: local
